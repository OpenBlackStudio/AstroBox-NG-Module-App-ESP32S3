name: Release

on:
  push:
    tags:
      - 'v*'

env:
  ESP_IDF_VERSION: "v5.3.3"
  MCU: "esp32s3"

jobs:
  build-release:
    name: Build Release Firmware
    runs-on: ubuntu-22.04
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: "sdcard,repo_net,mi_account,webui,plugin_runtime"
            artifact_name: "full-featured"
          - features: "sdcard,repo_net,mi_account,webui"
            artifact_name: "with-webui"
          - features: "sdcard,repo_net,mi_account"
            artifact_name: "core"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build dfu-util \
            python3 python3-pip python3-venv \
            gcc-arm-none-eabi libudev-dev libssl-dev
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Setup esp toolchain
        run: |
          # Install espup and ESP-IDF for esp32s3
          cargo install espup
          espup install esp32s3
          
          # Ensure required tools are available
          which espflash || cargo install espflash
          which ldproxy || cargo install ldproxy

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.espressif
            target
          key: release-${{ matrix.artifact_name }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            release-${{ matrix.artifact_name }}-

      - name: Build
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          set -e
          . $HOME/esp/esp-idf/export.sh 2>/dev/null || true
          export ESP_IDF_VERSION="v5.3.3"
          export MCU="esp32s3"
          
          cargo build --release --features "$FEATURES"

      - name: Generate firmware
        run: |
          set -e
          espflash save-image \
            --chip esp32s3 \
            --flash-size 16mb \
            --partition-table ./partitions.csv \
            "./target/xtensa-esp32s3-espidf/release/app_esp32s3" \
            "./astrobox_esp32s3_${{ matrix.artifact_name }}.bin"
          
          ls -lh ./astrobox_esp32s3_*.bin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "firmware-${{ matrix.artifact_name }}"
          path: astrobox_esp32s3_${{ matrix.artifact_name }}.bin
          retention-days: 90

  create-release:
    name: Create GitHub Release
    needs: build-release
    runs-on: ubuntu-22.04
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: artifacts
          merge-multiple: true

      - name: Display artifacts
        run: |
          ls -lh artifacts/

      - name: Extract changelog
        id: changelog
        run: |
          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          echo "## 🚀 AstroBox ESP32-S3 Firmware ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "### Available firmware versions:" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          for f in artifacts/*.bin; do
            size=$(du -h "$f" | cut -f1)
            name=$(basename "$f")
            echo "- \`$name\` ($size)" >> $GITHUB_OUTPUT
          done
          echo "" >> $GITHUB_OUTPUT
          echo "### Features comparison:" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "| Version | Features |" >> $GITHUB_OUTPUT
          echo "|---------|----------|" >> $GITHUB_OUTPUT
          echo "| core | sdcard, repo_net, mi_account |" >> $GITHUB_OUTPUT
          echo "| with-webui | sdcard, repo_net, mi_account, webui |" >> $GITHUB_OUTPUT
          echo "| full-featured | sdcard, repo_net, mi_account, webui, plugin_runtime |" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "### Flashing instructions:" >> $GITHUB_OUTPUT
          echo '```bash' >> $GITHUB_OUTPUT
          echo "# Install espflash" >> $GITHUB_OUTPUT
          echo "cargo install espflash" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "# Flash firmware" >> $GITHUB_OUTPUT
          echo "espflash flash -B 1500000 --flash-size 16mb --partition-table partitions.csv artifacts/firmware-*.bin" >> $GITHUB_OUTPUT
          echo '```' >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "---" >> $GITHUB_OUTPUT
          echo "*Generated by CI on $(date -u +"%Y-%m-%dT%H:%M:%SZ")*" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.bin
          body: ${{ steps.changelog.outputs.release_notes }}
          name: AstroBox ESP32-S3 ${{ github.ref_name }}
          draft: false
          prerelease: false
