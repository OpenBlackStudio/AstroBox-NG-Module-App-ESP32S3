name: Rust
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust Toolchain for Xtensa
        # You may pin to the exact commit or the version.
        # uses: esp-rs/xtensa-toolchain@ec6d36527049a7f4fb2cb0c1a644668c1bb8a2a4
        uses: esp-rs/xtensa-toolchain@v1.7.0
        with:
          # Set installed toolchain as default
          default: # optional, default is false
          # Comma separated list of targets
          buildtargets: # optional, default is esp32,esp32s2,esp32s3
          # Which version of the toolchain to install
          version: # optional, default is latest
          # Whether to install ldproxy (required for `std`)
          ldproxy: # optional, default is false
          # Whether to override the toolchain
          override: # optional, default is true
          # Whether to export the `${ESPUP_EXPORT_FILE}` into the GitHub environment
          export: # optional, default is true
          # Install the whole LLVM instead of only installing the libs
          extended-llvm: # optional, default is false
          # Xtensa Rust toolchain name
          name: # optional, default is esp
          # Install Espressif RISC‑V toolchain built with crosstool‑ng
          esp-riscv-gcc: # optional, default is false

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose
